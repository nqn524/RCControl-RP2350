[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/RCControl_ESmirth"]


[project]
name = "RCControl_ESmirth"
version = "1.1.4"
authors = [
  { name="E Smirthwaite", email="nqn524@york.ac.uk" },
]
description = "Library for the UOY Robotic Society"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/nqn524/RCControl-RP2350"
Issues = "https://github.com/nqn524/RCControl-RP2350/issues"